<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1" >
    <title></title>
    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
    <script src="../../node_modules/marked/marked.min.js"></script>
    <script src="../main/services/api.js"></script>
    <script src="../main/services/dataStorage.js"></script>
    <script src="../main/services/handelFiles.js"></script>
</head>
<body>

<div class="title-bar-drag"></div>

<div class="top" id="top" onclick="openMenu(this)">
    <div class="bar1"></div>
    <div class="bar2"></div>
</div>

<div class="menu" id="menu">

    <div class="settingsButton" id="settingsButton" onclick="document.getElementById('settingsMenu').showModal()" >

        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12.2503 15.6875C14.2869 15.6875 15.9379 14.0365 15.9379 11.9999C15.9379 9.96335 14.2869 8.31238 12.2503 8.31238C10.2138 8.31238 8.56281 9.96335 8.56281 11.9999C8.56281 14.0365 10.2138 15.6875 12.2503 15.6875Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"></path>
            <path d="M19.0539 18.7156L18.616 15.6753L21.4678 14.5345V9.46567L18.617 8.32522L19.055 5.28442L14.6652 2.75L12.2507 4.64979L9.83616 2.75L5.44642 5.28442L5.88433 8.32471L3.03229 9.46567V14.5345L5.88533 15.6759L5.4475 18.7156L9.83724 21.25L12.2507 19.3511L14.6642 21.25L19.0539 18.7156Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"></path>
        </svg>

    </div>

    <div id="menu-item" class="menu-item"></div>

    <button class="newChat" onclick="newChat()">New Chat</button>

    <ul id="chatList"></ul>

</div>

<dialog class="settingsMenu" id="settingsMenu">

    <div class="settingsButtonClose" id="settingsButtonClose" onclick="document.getElementById('settingsMenu').close()" >

        <svg width="25" height="25" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14.6455 10.1294L9.85352 14.9214" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"></path>
            <path d="M14.6456 14.9244L9.84961 10.1274" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"></path>
            <path fill-rule="evenodd" clip-rule="evenodd" d="M12.25 21.7847C17.3586 21.7847 21.5 17.6433 21.5 12.5347C21.5 7.42603 17.3586 3.28467 12.25 3.28467C7.14137 3.28467 3 7.42603 3 12.5347C3 17.6433 7.14137 21.7847 12.25 21.7847Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
        </svg>

    </div>

    <aside class="settings-sidebar">
        <ul class="settings-nav">
            <li class="nav-item active" onclick="showSection('general')">General Settings</li>
            <li class="nav-item" onclick="showSection('appearance')">Design Settings</li>
            <li class="nav-item" onclick="showSection('api')">API Setting</li>
        </ul>
    </aside>

    <main class="settings-content">
        <div id="section-general" class="settings-section">
            <div class="headerSettings">
                <svg width="50" height="50" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12.2503 15.6875C14.2869 15.6875 15.9379 14.0365 15.9379 11.9999C15.9379 9.96335 14.2869 8.31238 12.2503 8.31238C10.2138 8.31238 8.56281 9.96335 8.56281 11.9999C8.56281 14.0365 10.2138 15.6875 12.2503 15.6875Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"></path>
                    <path d="M19.0539 18.7156L18.616 15.6753L21.4678 14.5345V9.46567L18.617 8.32522L19.055 5.28442L14.6652 2.75L12.2507 4.64979L9.83616 2.75L5.44642 5.28442L5.88433 8.32471L3.03229 9.46567V14.5345L5.88533 15.6759L5.4475 18.7156L9.83724 21.25L12.2507 19.3511L14.6642 21.25L19.0539 18.7156Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"></path>
                </svg>
                <h2>General Settings</h2>
            </div>
            <div class="settings-area" id="settings-name">
                <h4>Name:</h4>
                <input type="Text" id="inputName" onchange="saveName()">
            </div>
            <br>
            <div class="settings-area" id="settings-language">
                <h4>Language:</h4>
                <input type="Text" id="inputLanguage" onchange="saveLanguage()">
            </div>
        </div>

        <div id="section-appearance" class="settings-section" style="display:none">
            <div class="headerSettings">
                <svg id="Edit" width="50" height="50" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M13.3352 19.5078H19.7122" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M16.0578 4.85889V4.85889C14.7138 3.85089 12.8078 4.12289 11.7998 5.46589C11.7998 5.46589 6.78679 12.1439 5.04779 14.4609C3.30879 16.7789 4.95379 19.6509 4.95379 19.6509C4.95379 19.6509 8.19779 20.3969 9.91179 18.1119C11.6268 15.8279 16.6638 9.11689 16.6638 9.11689C17.6718 7.77389 17.4008 5.86689 16.0578 4.85889Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                    <path d="M10.5042 7.21143L15.3682 10.8624" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
                <h2>Design Settings</h2>
            </div>
            <div class="settings-area">
                <h4>General Color</h4>
                <button class="buttonLight" onclick="setTheme('dark')">Light</button>
                <button class="buttonDark" onclick="setTheme('light')">Dark</button>
            </div>
            <br>
            <div class="settings-area">

                <h4>Background</h4>
                <div class="preview"></div>
                <div class="setting-row">
                    <label>Color 1:</label>
                    <input type="color" id="color1" class="colorInput" oninput="updateGradient()">
                </div>
                <div class="setting-row">
                    <label>Color 2:</label>
                    <input type="color" id="color2" class="colorInput" oninput="updateGradient()">
                </div>

                <div class="setting-row">
                    <label>Color 3:</label>
                    <input type="color" id="color3" class="colorInput" oninput="updateGradient()">
                </div>

                <div class="setting-row">
                    <label>Background Color:</label>
                    <input type="color" id="colorBackground" class="colorInput" oninput="updateGradient()">
                </div>

                <button class="resetGradient" onclick="resetGradient()" >Reset</button>
            </div>
        </div>

        <div id="section-api" class="settings-section" style="display:none">
            <div class="headerSettings">
                <svg id="Star" width="50" height="50" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12.25 2.75C13.4203 7.28687 16.9631 10.8297 21.5 12C16.9631 13.1703 13.4203 16.7131 12.25 21.25C11.0797 16.7131 7.53687 13.1703 3 12C7.53687 10.8297 11.0797 7.28687 12.25 2.75Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
                    <path d="M19.0013 2.75C19.0013 3.8975 20.3206 5.24836 21.4996 5.24836C20.2752 5.24836 19.0013 6.58523 19.0013 7.74671C19.0013 6.57766 17.648 5.24836 16.5029 5.24836C17.6934 5.24836 19.0013 3.8975 19.0013 2.75Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
                </svg>
                <h2>API Settings</h2>
            </div>

            <div class="settings-area" id="settings-api">
                <div class="setting-api-key">
                    <h4>API-Key:</h4>
                    <input type="Text" id="inputAPI" onchange="saveKey()">
                </div>
                <button id="butonLogs" onclick="openLink('https://openrouter.ai/logs')">Logs</button>
            </div>
            <br>

            <div class="settings-area" id="settings-modell">
                <h4>Modell Settings:</h4>
                <label>Modell 1:</label>
                <input type="Text" id="modellOne" onchange="setModel()">
                <br>
                <label>Modell 2:</label>
                <input type="Text" id="modellTwo" onchange="setModel()">
                <br>
                <label>Modell 3:</label>
                <input type="Text" id="modellThree" onchange="setModel()">
            </div>

        </div>

    </main>

</dialog>

<div class="main" id="main">

    <div id="out" class="out">
        <div id="anchor"></div>
    </div>

    <div class="input-wrapper" id="input-wrapper">

        <div class="center" id="center">
            <h1 id="centerTitel"></h1>
        </div>


        <div class="centerInput" id="centerInput">

            <button id="previewContainer" onclick="document.getElementById('docPreview').showModal()">
                <svg id="Folder" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M7.44458 15.4756H17.0376C17.4516 15.4756 17.7876 15.1396 17.7876 14.7256C17.7876 14.3116 17.4516 13.9756 17.0376 13.9756H7.44458C7.03058 13.9756 6.69458 14.3116 6.69458 14.7256C6.69458 15.1396 7.03058 15.4756 7.44458 15.4756Z" fill="currentColor"></path>
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M1.88989 14.0154C1.88989 21.5054 6.37989 22.1004 12.2499 22.1004C18.1199 22.1004 22.6099 21.5054 22.6099 13.9884C22.6099 12.1664 22.6099 9.11839 20.7249 7.08439C19.5519 5.81839 18.0299 5.84739 16.8079 5.87139C16.0709 5.88739 15.3729 5.89939 14.9099 5.63639C14.3279 5.30539 14.1299 4.93639 13.8799 4.46939C13.5929 3.93139 13.2339 3.26239 12.2879 2.75239C10.6089 1.84639 8.64489 1.66839 6.11089 2.18939C3.54689 2.71539 1.88989 4.97639 1.88989 7.94939V14.0154ZM6.41289 3.65839C7.24589 3.48739 8.00089 3.40139 8.69189 3.40139C9.79989 3.40139 10.7429 3.62339 11.5759 4.07239C12.1253 4.36907 12.3065 4.70765 12.5571 5.17586L12.5584 5.17839C12.8493 5.72022 13.2115 6.39472 14.1689 6.94039C14.9822 7.40205 15.9094 7.38672 16.8114 7.37181L16.8369 7.37139C17.9479 7.34839 18.9089 7.33239 19.6249 8.10339C21.1099 9.70639 21.1099 12.2824 21.1099 14.0154C21.1099 19.9514 18.2729 20.6004 12.2499 20.6004C6.08889 20.6004 3.38989 19.9774 3.38989 14.0154V7.94939C3.38989 6.17539 4.18389 4.11539 6.41289 3.65839Z" fill="currentColor"></path>
                </svg>
            </button>

            <div class="text-wrapper">
                <textarea class="text" id="text" placeholder="Ask me everything.."></textarea>
            </div>

            <button class="submit" id="submit" onclick="apiCall()">
                <svg width="20" height="20" viewBox="0 0 24 24" version="1.1" xmlns="http://www.w3.org/2000/svg">
                    <g id="Iconly/Light-Outline/Send" stroke="none" stroke-width="1.5" fill="none" fill-rule="evenodd">
                        <g id="Send" transform="translate(2.000000, 3.000000)" fill="currentColor">
                            <path d="M8.8049,11.8178 L12.4619,17.7508 C12.6219,18.0108 12.8719,18.0078 12.9729,17.9938 C13.0739,17.9798 13.3169,17.9178 13.4049,17.6228 L17.9779,2.1778 C18.0579,1.9048 17.9109,1.7188 17.8449,1.6528 C17.7809,1.5868 17.5979,1.4458 17.3329,1.5208 L1.8769,6.0468 C1.5839,6.1328 1.5199,6.3788 1.5059,6.4798 C1.4919,6.5828 1.4879,6.8378 1.7469,7.0008 L7.7479,10.7538 L13.0499,5.3958 C13.3409,5.1018 13.8159,5.0988 14.1109,5.3898 C14.4059,5.6808 14.4079,6.1568 14.1169,6.4508 L8.8049,11.8178 Z M12.8949,19.4998 C12.1989,19.4998 11.5609,19.1458 11.1849,18.5378 L7.3079,12.2468 L0.9519,8.2718 C0.2669,7.8428 -0.0911,7.0788 0.0199,6.2758 C0.1299,5.4728 0.6809,4.8348 1.4549,4.6078 L16.9109,0.0818 C17.6219,-0.1262 18.3839,0.0708 18.9079,0.5928 C19.4319,1.1198 19.6269,1.8898 19.4149,2.6038 L14.8419,18.0478 C14.6129,18.8248 13.9729,19.3738 13.1719,19.4808 C13.0779,19.4928 12.9869,19.4998 12.8949,19.4998 L12.8949,19.4998 Z" id="Fill-1"></path>
                        </g>
                    </g>
                </svg>
            </button>

            <div class="animation" id="animation"></div>

        </div>

        <dialog id="docPreview">

            <div class="docPreviewClose" id="docPreviewClose" onclick="document.getElementById('docPreview').close()" >

                <svg width="25" height="25" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M14.6455 10.1294L9.85352 14.9214" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"></path>
                    <path d="M14.6456 14.9244L9.84961 10.1274" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"></path>
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M12.25 21.7847C17.3586 21.7847 21.5 17.6433 21.5 12.5347C21.5 7.42603 17.3586 3.28467 12.25 3.28467C7.14137 3.28467 3 7.42603 3 12.5347C3 17.6433 7.14137 21.7847 12.25 21.7847Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
                </svg>

            </div>

            <ul id="docList"></ul>

        </dialog>

    </div>

</div>

</body>
</html>
